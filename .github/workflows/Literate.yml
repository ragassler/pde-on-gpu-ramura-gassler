name: Run Literate.jl
# adapted from https://lannonbr.com/blog/2019-12-09-git-commit-in-actions

on: [push, pull_request]

permissions:
  contents: write   # <-- ADD THIS (top-level)


jobs:
  lit:
    runs-on: ubuntu-latest
    steps:
      # Checkout the branch
      - uses: actions/checkout@v4
        with:
          token: ${{ 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 }}  # <-- ADD THIS
          fetch-depth: 0   

      - uses: julia-actions/setup-julia@latest
        with:
          version: '1.12'
          arch: x64

      - uses: julia-actions/cache@v1
      - uses: julia-actions/julia-buildpkg@latest

      - name: run Literate
        run: QT_QPA_PLATFORM=offscreen julia --color=yes --project -e 'cd("PorousConvection/Literate"); import Pkg; Pkg.activate("."); Pkg.instantiate(); include("literate_script.jl")'

      - name: setup git config
        run: |
          # setup the username and email. 
          git config user.name "ragassler"
          git config user.email "<rgassler@ethz.ch>"

      - name: commit
        run: |
          # Stage the file, commit and push
          git add PorousConvection/Literate/md/*
          git commit -m "Commit markdown files fom Literate"
          git push origin HEAD:final-clean 
