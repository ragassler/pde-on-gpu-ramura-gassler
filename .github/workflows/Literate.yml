name: Run Literate.jl

on:
  push:
    branches: [final-clean]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  lit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ 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 }}
          fetch-depth: 0

      - uses: julia-actions/setup-julia@latest
        with:
          version: '1.12'
          arch: x64

      - uses: julia-actions/cache@v1
        if: github.event_name == 'push'

      - uses: julia-actions/julia-buildpkg@latest

      - name: run Literate
        run: |
          QT_QPA_PLATFORM=offscreen julia --color=yes --project -e '
            cd("PorousConvection/Literate");
            import Pkg;
            Pkg.activate(".");
            Pkg.instantiate();
            include("literate_script.jl")'

      # On PRs: don't push, just check that nothing changed
      - name: Check generated files committed (PR)
        if: github.event_name == 'pull_request'
        run: |
          git add -A PorousConvection/Literate -- ':!PorousConvection/Literate/Manifest.toml'
          if ! git diff --cached --quiet; then
            echo "Literate outputs are not committed."
            git diff --cached --name-only
            exit 1
          fi

      # On pushes to final-clean: commit + push back to final-clean
      - name: Commit & push generated files (push)
        if: github.event_name == 'push'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A PorousConvection/Literate -- ':!PorousConvection/Literate/Manifest.toml'

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore: update Literate outputs [skip ci]"
          git push origin HEAD:final-clean
